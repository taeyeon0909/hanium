<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cocoworker onlinecontroller</title>
  <link rel="stylesheet" href="online-style.css" />
  <script src="onlinecontroller.js" defer></script>
</head>
<body>
  <div class="overlay" id="modelOverlay">
    <div class="popup">
      <h2>모델 선택</h2>
      <select id="modelSelect">
        <option value="" disabled selected>모델을 선택하세요</option>
        <option value="modelA">PROTOTYPE</option>
      </select>
      <button onclick="confirmModel()">확인</button>
    </div>
  </div>

  <div class="controller-container" id="mainContent">
    <header>
      <h1>온라인 로봇 컨트롤러</h1>
    </header>

    <section class="video">
      <h2>카메라 화면</h2>
      <svg width="100%" height="300px" style="background:#ddd; border-radius:8px">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#666">
          영상 스트림 위치
        </text>
      </svg>
    </section>

    <div class="controls-grid">
      <div class="left-panel">
        <h2>조작 패널</h2>
        <div class="toggle-control">
          <label>
            <input type="checkbox" id="keyboard-toggle" />
            키보드 입력 활성화 (WASD)
          </label>
        </div>

        <div class="joystick-layout">
          <div class="row">
            <button onclick="sendCommand('forward')" class="dir-button">▲</button>
          </div>
          <div class="row">
            <button onclick="sendCommand('left')" class="dir-button">◀</button>
            <button onclick="sendCommand('stop')" class="dir-button">■</button>
            <button onclick="sendCommand('right')" class="dir-button">▶</button>
          </div>
          <div class="row">
            <button onclick="sendCommand('backward')" class="dir-button">▼</button>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <h2>명령어 입력 (CLI)</h2>
        <div class="cli-box">
          <input type="text" id="cli-input" placeholder="예: auto start" />
          <button onclick="runCLI()">전송</button>
        </div>
        <div class="cli-log" id="cli-log">
          <!-- 명령 결과 표시 -->
        </div>
      </div>
    </div>

    <section class="status">
      <h2>로봇 상태</h2>
      <div id="status-text">연결되지 않음</div>
    </section>

    <footer>
      <p>2025 한이음 드림업 team cocoworker</p>
    </footer>
  </div>


</body>
</html>
